<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-label="Як три датчики обирають одну дію"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677c"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203443"><text x="450" y="45" text-anchor="middle" font-size="30">Три датчики → одна дія</text><text x="450" y="80" text-anchor="middle" font-size="20">Перевіряємо по черзі: центр → ліворуч → праворуч</text><rect x="70" y="105" width="410" height="62" rx="14" fill="#f0f3f8" stroke="#95a5b5" stroke-width="2"/><text x="275" y="144" text-anchor="middle" font-size="23">Зчитати три покази</text><path d="M275 167V202" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="210" width="410" height="70" rx="14" fill="#e9f2fe" stroke="#95a5b5" stroke-width="2"/><text x="275" y="253" text-anchor="middle" font-size="23">Центр бачить темне?</text><path d="M480 245H610" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="231" text-anchor="middle" font-size="19">так</text><rect x="620" y="210" width="220" height="70" rx="14" fill="#e8f5eb" stroke="#95a5b5" stroke-width="2"/><text x="730" y="253" text-anchor="middle" font-size="23">↑ Вперед</text><path d="M275 280V347" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="314" text-anchor="middle" font-size="19">ні</text><rect x="70" y="355" width="410" height="70" rx="14" fill="#e9f2fe" stroke="#95a5b5" stroke-width="2"/><text x="275" y="398" text-anchor="middle" font-size="23">Лівий бачить темне?</text><path d="M480 390H610" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="376" text-anchor="middle" font-size="19">так</text><rect x="620" y="355" width="220" height="70" rx="14" fill="#e8f5eb" stroke="#95a5b5" stroke-width="2"/><text x="730" y="398" text-anchor="middle" font-size="23">↶ Ліворуч</text><path d="M275 425V492" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="459" text-anchor="middle" font-size="19">ні</text><rect x="70" y="500" width="410" height="70" rx="14" fill="#e9f2fe" stroke="#95a5b5" stroke-width="2"/><text x="275" y="543" text-anchor="middle" font-size="23">Правий бачить темне?</text><path d="M480 535H610" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="521" text-anchor="middle" font-size="19">так</text><rect x="620" y="500" width="220" height="70" rx="14" fill="#e8f5eb" stroke="#95a5b5" stroke-width="2"/><text x="730" y="543" text-anchor="middle" font-size="23">↷ Праворуч</text><path d="M275 570V637" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="604" text-anchor="middle" font-size="19">ні</text><rect x="150" y="645" width="250" height="55" rx="14" fill="#fce9e7" stroke="#95a5b5" stroke-width="2"/><text x="275" y="680.5" text-anchor="middle" font-size="23">■ Стоп</text><text x="700" y="653" text-anchor="middle" font-size="17">Обрана гілка завершує вибір.</text><text x="700" y="680" text-anchor="middle" font-size="17">Наступні умови не перевіряємо.</text></g></svg>