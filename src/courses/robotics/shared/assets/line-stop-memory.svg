<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Пам’ять про втрату лінії"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677c"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203443"><text x="450" y="48" text-anchor="middle" font-size="28">Після втрати лінії стоп зберігається</text><rect x="45" y="130" width="290" height="100" rx="14" fill="#e8f5eb" stroke="#95a5b5" stroke-width="2"/><text x="190" y="188" text-anchor="middle" font-size="23">Рух дозволений</text><rect x="565" y="130" width="290" height="100" rx="14" fill="#fce9e7" stroke="#95a5b5" stroke-width="2"/><text x="710" y="188" text-anchor="middle" font-size="23">Стоп запам’ятовано</text><path d="M335 160H555" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="120" text-anchor="middle" font-size="20">Лінію втрачено</text><path d="M710 230V310H190V240" fill="none" stroke="#53677c" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="300" text-anchor="middle" font-size="20">Новий старт / EN–RESET</text><text x="710" y="260" text-anchor="middle" font-size="18">Лінія повернулася? Стоїмо.</text><text x="190" y="260" text-anchor="middle" font-size="18">Перевіряємо покази.</text></g></svg>