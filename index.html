<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepBy School — шкільні предмети крок за кроком</title>
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --ink:#1f2340; --muted:#6b7196;
  --primary:#5b4be6; --primary-d:#4636c9; --primary-l:#eceafd;
  --green:#12a36b; --green-l:#e2f6ee; --amber:#e0982a; --amber-l:#fdf1dd;
  --pink:#d63c8a; --pink-l:#fce6f2; --line:#e6e8f2; --shadow:0 8px 30px rgba(40,40,90,.08);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* ===== Top bar ===== */
header.topbar{background:linear-gradient(100deg,#5b4be6,#7d5bef);color:#fff;padding:14px 26px;display:flex;align-items:center;gap:18px;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.2px;cursor:pointer}
.logo .mark{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px}
.logo .brand{display:flex;flex-direction:column;line-height:1.12}
.logo .brand .bn{font-weight:800;font-size:20px;letter-spacing:.2px}
.logo .brand .bn i{font-style:normal;font-weight:600;opacity:.9}
.logo .brand .bt{font-weight:500;font-size:10.5px;opacity:.82;letter-spacing:.2px}
.role-tabs{margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.14);padding:5px;border-radius:12px}
.role-tabs button{color:#fff;padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;opacity:.8;transition:.15s;display:flex;gap:7px;align-items:center}
.role-tabs button.active{background:#fff;color:var(--primary);opacity:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:30px}
.who .av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:700}

/* ===== Layout ===== */
.wrap{max-width:1180px;margin:0 auto;padding:26px}
.wrap.wide{max-width:1320px}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:18px;flex-wrap:wrap}
.crumbs a{color:var(--primary);cursor:pointer;font-weight:600}
.crumbs span.sep{opacity:.5}
h1.page{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:22px}

.grid{display:grid;gap:16px}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.grid.c3,.grid.c2{grid-template-columns:1fr}}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid var(--line)}
.card.click{cursor:pointer;transition:.18s}
.card.click:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(40,40,90,.14)}
.card .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:5px}
.card p.d{color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--primary-l);color:var(--primary)}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

.btn{background:var(--primary);color:#fff;padding:11px 20px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--primary-d)}
.btn.ghost{background:var(--primary-l);color:var(--primary)}
.btn.ghost:hover{background:#e0ddfb}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.green{background:var(--green)}
.btn.gray{background:#eceef5;color:var(--ink)}
.btn.gray:hover{background:#e2e5ef}

input,select,textarea{font-family:inherit;font-size:15px;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;width:100%;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:14px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}

/* ===== Tool workspace ===== */
.tool-shell{display:grid;grid-template-columns:224px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.tool-shell{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:20px}
/* компактний конфігуратор завдання */
.tool-shell .cfg{padding:16px}
.tool-shell .cfg h3{font-size:15px;margin-bottom:10px}
.tool-shell .cfg .field{margin-bottom:10px}
.tool-shell .cfg label.fl{font-size:12px;margin-bottom:4px}
.tool-shell .cfg input,.tool-shell .cfg select{padding:7px 10px;font-size:14px;border-radius:9px}
.tool-shell .cfg .btn{padding:9px 14px;font-size:13px}
.tool-shell .cfg .helper{font-size:12px;margin-top:8px}
.panel h3{font-size:16px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.stage{min-height:480px;display:flex;flex-direction:column}
.stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.step-count{font-size:13px;color:var(--muted);font-weight:600}
.calc{flex:1;display:flex;padding:0;overflow:auto}
.explain{background:var(--primary-l);color:var(--primary-d);border-radius:12px;padding:14px 16px;font-size:15px;font-weight:500;margin-top:14px;min-height:54px;display:flex;align-items:center}
.explain.done{background:var(--green-l);color:#0c7a4f}
.step-nav{display:flex;gap:10px;margin-top:16px;justify-content:center}

/* ===== Зошит у клітинку ===== */
:root{--cell:30px; --grid:#c4d8ef; --graphite:#2f3550; --paper:#fbfdff}
.paper{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:var(--cell) var(--cell);
  border:1px solid #d3e2f4;border-radius:8px;
  box-shadow:0 2px 10px rgba(60,90,140,.08);
}
.notebook{display:inline-grid;grid-auto-rows:var(--cell)}
.nk{width:var(--cell);height:var(--cell);display:grid;place-items:center;
  font-family:'JetBrains Mono','Consolas',monospace;font-size:19px;color:var(--graphite);position:relative}
.nk.res{color:var(--green);font-weight:700}
.nk.op{color:var(--pink);font-weight:800}
.nk.muted{color:#98a0bd}
.nk.ul::after{content:"";position:absolute;left:-1px;right:-1px;bottom:0;height:2px;background:var(--graphite);border-radius:2px}
.divwrap{display:flex;align-items:flex-start}
.divwrap .notebook{border:none;box-shadow:none;background:transparent}
.divbar{align-self:stretch;border-left:3px solid var(--graphite)}
.paper.sheet{flex:1;padding:var(--cell);box-sizing:border-box;min-height:calc(var(--cell)*13);overflow:auto}

/* fractions */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:21px;font-family:'JetBrains Mono',monospace;color:var(--graphite)}
.frac .fn{padding:0 6px}
.frac .fd{padding:0 6px}
.frac .fbar{align-self:stretch;height:2px;background:var(--graphite);margin:2px 0;border-radius:1px}
.eqline{font-size:22px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;color:var(--graphite)}
.eqline .hl{background:var(--amber-l);color:var(--amber);border-radius:6px;padding:0 6px}
.eqline .res{color:var(--green);font-weight:700}

/* equation */
.eqstep{font-size:22px;font-family:'JetBrains Mono',monospace;text-align:center;color:var(--graphite);line-height:1.7}
.eqsolve{display:flex;flex-direction:column;align-items:flex-start;font-family:'JetBrains Mono',monospace;color:var(--graphite)}
.eqrow{font-size:20px;height:var(--cell);display:flex;align-items:center;gap:5px;padding:0 8px;border-radius:7px;white-space:nowrap;transition:background .2s}
.eqrow.cur{background:rgba(224,152,42,.18)}
.eqrow.done-row{background:var(--green-l)}
.eqrow .res{color:var(--green);font-weight:700}
.eqrow .op{color:var(--pink);font-weight:700}
.eqrow .muted{color:#98a0bd}
.eqrow .note{font-size:14px;color:var(--muted);margin-left:8px;font-family:'Segoe UI',sans-serif}
/* поява символів: «write» — послідовне написання; «move/combine» — переліт цифр (керує JS) */
.eqsolve{position:relative}
.eqrow .eq-eq{color:var(--pink);font-weight:700}
.eqrow .tok{display:inline-block}
@keyframes tokWrite{0%{opacity:0;transform:translateY(-4px) scale(.75);filter:blur(.7px)}100%{opacity:1;transform:none;filter:none}}
@keyframes tokPop{0%{transform:scale(.4);opacity:.3}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes signFlip{0%{transform:scale(1)}45%{transform:scale(1.55) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
.eqrow.writing .note{animation:tokWrite .3s ease-out both}
.eqclone{position:absolute;font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--graphite);pointer-events:none;will-change:transform}
.eqclone.op{color:var(--pink);font-weight:700}
.eqclone.res{color:var(--green);font-weight:700}
/* рукописні гліфи: перо малює контур */
.hwg{height:1.02em;width:.6em;display:inline-block;vertical-align:-.19em;overflow:visible}
.hwg path{fill:none;stroke:currentColor;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.hwt{font-family:inherit}
@keyframes hwdraw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.eqrow.writing .note{animation:none!important}.hwg path{animation:none!important;stroke-dashoffset:0!important}}
/* ланцюжок дробів в один рядок з переносом (flex-wrap) */
.fracsolve{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 10px;font-family:'JetBrains Mono',monospace;color:var(--graphite);max-width:100%}
.fseg{display:inline-flex;flex-direction:column;align-items:center;white-space:nowrap}
.fseg-math{display:inline-flex;align-items:center;gap:7px}
.fseg .funit{display:inline-flex;align-items:center}
.fseg .feq,.fseg .fop{color:var(--pink);font-weight:700;font-size:22px}
.fseg .fmix{font-size:21px;margin-right:4px}
.fmul{color:var(--primary);font-weight:700}
.fseg.flymul .fmul{opacity:0}
.fmulclone{position:absolute;font-family:'JetBrains Mono',monospace;font-size:21px;color:var(--primary);font-weight:700;pointer-events:none;will-change:transform;z-index:6}
@keyframes fmulPop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
/* крок-обчислення: числа приховані, поки не прилетять і не перетворяться на результат */
.fseg.morphing .fn,.fseg.morphing .fd{opacity:0}
.fseg.morphing .feq,.fseg.morphing .fop,.fseg.morphing .fmix{animation:fracIn .3s ease-out both}
.fseg.morphing .fbar{animation:barDraw .3s ease-out both;transform-origin:left}
.fracmorph{position:absolute;font-family:'JetBrains Mono',monospace;font-size:21px;color:var(--graphite);pointer-events:none;will-change:transform;z-index:6;white-space:nowrap;padding:0 6px;line-height:1}
.fracmorph.fmlabel{padding:0;background:rgba(255,255,255,.65);border-radius:6px}
.fracmorph .fmop{color:var(--pink);font-weight:700;margin:0 5px}
.fnote{font-size:11px;color:var(--muted);font-family:'Segoe UI',sans-serif;text-align:center;line-height:1.15;margin-top:2px;max-width:140px;white-space:normal}
.fdone .fn,.fdone .fd,.fdone .fmix{color:var(--green);font-weight:700}
.fdone .fbar{background:var(--green)}
@keyframes fracIn{0%{opacity:0;transform:scale(.5) translateY(-4px)}100%{opacity:1;transform:none}}
@keyframes barDraw{0%{opacity:0;transform:scaleX(0)}100%{opacity:1;transform:scaleX(1)}}
/* послідовний рукописний запис: цифри малюються штрихами (hwdraw), риска — окремим тактом, підпис — плавно */
.fseg.writing .fnote{animation:fracIn .3s ease-out both}
.fseg.writing .fbar{animation:barDraw .28s ease-out both;transform-origin:left}
@media(prefers-reduced-motion:reduce){.fseg.writing .fnote,.fseg.writing .fbar{animation:none!important}}
/* робоча область пошуку спільного знаменника (НСК) */
.fracwork{display:flex;flex-direction:column;gap:18px}
.denbox{background:rgba(91,75,230,.05);border:1.5px dashed #cfc8f5;border-radius:12px;padding:12px 14px;max-width:560px;font-family:'Segoe UI',sans-serif}
.denttl{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px}
.denrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.denlbl{font-size:13px;color:var(--muted);min-width:96px;font-weight:600}
.denchip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;padding:2px 7px 3px;background:#fff;border:1px solid var(--line);border-radius:8px;font-family:'JetBrains Mono',monospace;line-height:1.05}
.denchip .chipk{font-size:10px;color:#a8adc4;font-weight:700}
.denchip .chipv{font-size:15px;color:var(--graphite)}
.denchip.hl{background:var(--green-l);border-color:var(--green);transform:scale(1.06)}
.denchip.hl .chipv{color:var(--green);font-weight:700}
.denchip.mul{box-shadow:0 0 0 2px var(--primary)}
.denchip.mul .chipk{color:var(--primary);font-size:12px}
.denres .mk{color:var(--primary)}
.denchip.chipnew{animation:chipPop .32s ease-out}
.denchip.hl.chipnew{animation:chipMatch .5s ease-out}
@keyframes chipPop{0%{opacity:0;transform:scale(.3) translateY(-8px)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes chipMatch{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.5)}75%{transform:scale(1.05)}100%{opacity:1;transform:scale(1.06)}}
.denres{font-size:15px;color:var(--graphite);margin-top:2px}
.denres b{color:var(--green);font-size:17px}
.denmul{font-size:14px;color:var(--graphite);margin-top:8px;font-family:'JetBrains Mono',monospace}
.denmul b{color:var(--primary)}
.denhint{font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--muted);margin-left:4px}
@keyframes denIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.list-item .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.list-item .txt{flex:1}
.list-item .txt b{display:block}
.list-item .txt small{color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px}
.badge.ok{background:var(--green-l);color:var(--green)}
.badge.new{background:var(--amber-l);color:var(--amber)}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
table.tbl th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
table.tbl tr:last-child td{border-bottom:none}

.stat{display:flex;gap:14px}
.stat .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat .box .n{font-size:28px;font-weight:800;color:var(--primary)}
.stat .box .l{color:var(--muted);font-size:13px}

.section-title{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:26px 0 12px}
.modal-bg{position:fixed;inset:0;background:rgba(25,25,55,.45);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:6px}
.modal .close{position:absolute}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-l);padding:6px 12px;border-radius:20px}
.helper{font-size:13px;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:40px}

/* ---- Дільники і кратні (контраст) ---- */
.dvk{display:flex;flex-direction:column;gap:15px;font-family:'Segoe UI',sans-serif;max-width:660px}
.dvk-num{align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.dvk-num .nbig{font-size:40px;font-weight:800;color:var(--graphite);font-family:'JetBrains Mono',monospace;line-height:1;
  width:74px;height:74px;display:grid;place-items:center;background:transparent;border:2.5px solid var(--primary);border-radius:16px}
.dvk-num .ncap{font-size:12px;color:var(--muted)}
.dlane{border-radius:14px;padding:12px 14px 14px;border:1.5px solid}
.dlane.d{background:transparent;border-color:#8fd0ad}
.dlane.k{background:transparent;border-color:#e6c583}
.dlane-hd{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.dlane-hd .lt{font-size:15px;font-weight:800}
.dlane.d .lt{color:var(--green)} .dlane.k .lt{color:#b5852a}
.dlane-hd .lsub{font-size:12px;color:var(--muted);font-weight:600}
.dlane-hd .cnt{margin-left:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace}
.dlane.d .cnt{background:transparent;color:var(--green);border:1px solid #8fd0ad}
.dlane.k .cnt{background:transparent;color:#b5852a;border:1px solid #e6c583}
/* ланцюг кратних — відкритий, тягнеться до ∞ */
.ktrack{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:12px 6px 4px}
.kstop{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;padding:5px 8px;background:transparent;border:1.5px solid #e0be79;border-radius:10px}
.kstop .kv{font-size:16px;font-weight:800;color:#b5852a;font-family:'JetBrains Mono',monospace;line-height:1}
.kstop .kk{font-size:9px;color:#c2a25f;font-weight:700;margin-top:1px}
.kstop.first{border-color:var(--amber);border-width:2.5px}
.kdash{width:26px;height:3px;background:linear-gradient(90deg,#d9bd7a 60%,transparent 0) repeat-x;background-size:8px 3px;margin:0 1px}
.kinf{font-size:24px;font-weight:800;color:#b5852a;padding-left:6px;font-family:'JetBrains Mono',monospace}
/* ланцюг дільників — той самий вигляд, але ділення й закритий кінець */
.dlane.d .ktrack{row-gap:24px;margin-bottom:18px}
.kstop{position:relative}
.dlane.d .kstop{border-color:#a8dcc0;min-width:54px}
.dlane.d .kstop .kv{color:var(--green)}
.dlane.d .kstop .kk{color:#5fae87}
.dlane.d .kstop.first,.dlane.d .kstop.last{border-color:var(--green);border-width:2.5px}
.dlane.d .kdash{background:linear-gradient(90deg,#8fd0ad 60%,transparent 0) repeat-x;background-size:8px 3px}
.kcap{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:9.5px;font-weight:800;
  letter-spacing:.2px;white-space:nowrap;color:var(--green)}
.kend{width:4px;height:30px;background:var(--green);border-radius:2px;margin-left:9px}
.dlane .note{font-size:12.5px;color:var(--graphite);margin-top:9px;line-height:1.45}
.dlane.d .note b{color:var(--green)} .dlane.k .note b{color:#b5852a}
/* міст: одна дія — два прочитання */
.dvk-bridge{border:1.5px dashed var(--pink);background:transparent;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.bridge-eq{display:flex;align-items:center;gap:5px}
.bridge-eq .rem{font-size:13px;color:var(--green);font-weight:700;margin-left:6px}
.bridge-reads{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.bread{flex:1;min-width:180px;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border-radius:11px;padding:10px 12px;border:1px solid #cfd8ea}
.bread .arw{font-size:18px;line-height:1}
.bread .big{font-size:15px;font-weight:800;text-align:center}
.bread .sml{font-size:11.5px;color:var(--muted);text-align:center}
.bread.d{border-color:#bfe6cf} .bread.d .big{color:var(--green)} .bread.d .arw{color:var(--green)}
.bread.k{border-color:#f2e0b6} .bread.k .big{color:#b5852a} .bread.k .arw{color:#b5852a}
/* підсумкова таблиця-контраст */
.dvk-sum{border:1px solid #cfd8ea;border-radius:14px;overflow:hidden}
.dvk-sum table{width:100%;border-collapse:collapse;font-size:13.5px}
.dvk-sum td,.dvk-sum th{padding:9px 12px;border-bottom:1px solid #dfe6f3;text-align:left}
.dvk-sum th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:transparent}
.dvk-sum tr:last-child td{border-bottom:none}
.dvk-sum .cd{color:var(--green);font-weight:700} .dvk-sum .ck{color:#b5852a;font-weight:700}
.dvk-sum td.rl{color:var(--muted);font-weight:600;width:150px;background:transparent}
.dvk-verdict{font-size:13.5px;color:var(--graphite);background:transparent;border:1px solid #cfd8ea;border-radius:11px;padding:11px 14px;line-height:1.5}
.dvk-verdict b{color:var(--primary)}
@keyframes dvkpop{0%{opacity:0;transform:translateY(7px) scale(.6)}70%{transform:translateY(0) scale(1.14)}100%{opacity:1;transform:scale(1)}}
.dvk .pop{animation:dvkpop .34s ease backwards}
@media(prefers-reduced-motion:reduce){.dvk .pop{animation:none!important}}
</style>
</head>

<div class="wrap" id="app"></div>

<script>

     ]},
    {id:'t3', cls:'5a', subject:'math', title:'Звичайні дроби',

    {id:'t5', cls:'6a', subject:'math', title:'Дії з дробами',

     materials:[{type:'text', title:'Конспект: НСК знаменників'}],

       {id:'k9', tool:'frac', title:'Обчисли 7/10 + 2/15', cfg:{a:7,b:10,op:'+',c:2,d:15}, done:false},

    div:{name:'Ділення в стовпчик', icon:'➗', color:'var(--green)', bg:'var(--green-l)'},
  }

/* =========================================================
   СТАН ІНТЕРФЕЙСУ
   ========================================================= */
const S = { role:'student', view:'home', cls:null, subject:null, topic:null, tool:null, toolCfg:null, step:0, steps:[], eqModel:null, eqAnim:null, fracModel:null, fracFlip:null, dvkModel:null };

const app = document.getElementById('app');
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* Role switch */
// повернення на головну (клік по лого)
function goHome(){ S.view='home'; S.cls=null; S.subject=null; S.topic=null; S.tool=null; S.step=0; render(); }

/* =========================================================
   РОУТЕР
   ========================================================= */
function render(){
  app.classList.toggle('wide', !!S.tool);   // ширша сторінка для інструмента (зошит займає більше місця)
  if(S.tool){ return renderTool(); }
  return renderStudent();
}

function crumbs(parts){
  return '<div class="crumbs">'+parts.map((p,i)=>{
    const sep = i<parts.length-1 ? '<span class="sep">›</span>' : '';
    if(p.go) return `<a onclick="${p.go}">${esc(p.t)}</a>${sep}`;
    return `<span>${esc(p.t)}</span>${sep}`;
  }).join('')+'</div>';
}

/* =========================================================
   КАБІНЕТ УЧНЯ
   ========================================================= */
function renderStudent(){
  // home -> вибір класу; далі предмет; далі теми; далі тема
  if(!S.cls){
    app.innerHTML = `
      <h1 class="page">Оберіть клас 👋</h1>
      <p class="sub">Оберіть клас, щоб перейти до предметів і покрокових інтерактивних інструментів.</p>
      <div class="grid c3">
        ${DB.classes.map(c=>`
          <div class="card click" onclick="pick('cls','${c.id}')">
            <div class="ico" style="background:var(--primary-l)">🏫</div>
            <h3>${esc(c.name)} клас</h3>
            <p class="d">${DB.topics.filter(t=>t.cls===c.id).length} навчальних тем</p>
          </div>`).join('')}
      </div>`;
    return;
  }
  const clsName = DB.classes.find(c=>c.id===S.cls).name;
  const subjName = S.subject ? ((DB.subjects.find(s=>s.id===S.subject)||{}).name || 'Предмет') : 'Предмет';
  if(!S.subject){
    app.innerHTML = crumbs([{t:'Класи',go:"pick('cls',null)"},{t:clsName+' клас'}]) + `
      <h1 class="page">Предмети — ${esc(clsName)} клас</h1>
      <p class="sub">Оберіть предмет. Наразі наповнена математика — українська мова, фізика та хімія в розробці.</p>
      <div class="grid c3">
        ${DB.subjects.map(s=>`
          <div class="card ${s.active?'click':''}" ${s.active?`onclick="pick('subject','${s.id}')"`:'style="opacity:.55"'}>
            <div class="ico" style="background:${s.bg}">${s.icon}</div>
            <h3>${esc(s.name)}</h3>
            <p class="d">${s.active?'Доступні теми та інтерактивні інструменти':'Скоро з’явиться'}</p>
            ${s.active?'<div class="tag-row"><span class="pill">Активний</span></div>':''}
          </div>`).join('')}
      </div>`;
    return;
  }
  if(!S.topic){
    const topics = DB.topics.filter(t=>t.cls===S.cls && t.subject===S.subject);
    app.innerHTML = crumbs([{t:'Класи',go:"pick('cls',null)"},{t:clsName+' клас',go:"pick('subject',null)"},{t:subjName}]) + `
      <h1 class="page">${esc(subjName)} — ${esc(clsName)} клас</h1>
      <p class="sub">Оберіть тему навчальної програми.</p>
      <div class="grid c2">
        ${topics.map(t=>{
          const done=t.tasks.filter(x=>x.done).length;
          return `<div class="card click" onclick="pick('topic','${t.id}')">
            <div style="display:flex;justify-content:space-between;align-items:start">
              <div class="ico" style="background:var(--primary-l)">📘</div>
              <span class="pill">${done}/${t.tasks.length} виконано</span>
            </div>
            <h3>${esc(t.title)}</h3>
            <p class="d">${esc(t.desc)}</p>
            <div class="tag-row">
              ${[...new Set(t.tasks.map(x=>x.tool))].map(tl=>`<span class="chip">${DB.tools[tl].icon} ${DB.tools[tl].name}</span>`).join('')}
            </div>
          </div>`;
        }).join('') || '<div class="empty">Тем поки немає</div>'}
      </div>`;
    return;
  }
  // сторінка теми
  const t = DB.topics.find(x=>x.id===S.topic);
  const matIcon={video:'🎬',text:'📄',test:'✅'};
  app.innerHTML = crumbs([{t:'Класи',go:"pick('cls',null)"},{t:clsName+' клас',go:"pick('subject',null)"},{t:subjName,go:"pick('topic',null)"},{t:t.title}]) + `
    <h1 class="page">${esc(t.title)}</h1>
    <p class="sub">${esc(t.desc)}</p>

    <div class="section-title">🧩 Інтерактивні завдання від вчителя</div>
    <div class="grid c2">
      ${t.tasks.map(k=>`
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
            <div class="ico" style="background:${DB.tools[k.tool].bg};margin:0">${DB.tools[k.tool].icon}</div>
            ${k.done?'<span class="badge ok">✓ виконано</span>':'<span class="badge new">нове</span>'}
          </div>
          <h3>${esc(k.title)}</h3>
          <p class="d">${DB.tools[k.tool].name}</p>
          <div style="margin-top:14px">
            <button class="btn sm" onclick="openTool('${k.tool}',${JSON.stringify(k.cfg).replace(/"/g,'&quot;')},'${k.id}')">▶ Розв’язати крок за кроком</button>
          </div>
        </div>`).join('')}
    </div>

    <div class="section-title">📚 Навчальні матеріали</div>
    <div class="card">
      ${t.materials.map(m=>`
        <div class="list-item">
          <div class="ic" style="background:var(--primary-l)">${matIcon[m.type]||'📄'}</div>
          <div class="txt"><b>${esc(m.title)}</b><small>${m.type==='video'?'Відеоурок':m.type==='test'?'Інтерактивний тест':'Текстовий конспект'}</small></div>
          <button class="btn ghost sm" onclick="toast('Демо: матеріал відкрито')">Відкрити</button>
        </div>`).join('')}
    </div>

    <div class="section-title">🛠️ Спробувати інструменти вільно</div>
    <div class="grid c2">
      ${[...new Set(t.tasks.map(x=>x.tool))].map(tl=>`
        <div class="card click" onclick="openTool('${tl}',null,null)">
          <div class="ico" style="background:${DB.tools[tl].bg}">${DB.tools[tl].icon}</div>
          <h3>${DB.tools[tl].name}</h3>
          <p class="d">Введи власні числа і розв’яжи крок за кроком</p>
        </div>`).join('')}
    </div>`;
}

function pick(key,val){
  if(key==='cls'){ S.cls=val; S.subject=null; S.topic=null; }
  if(key==='subject'){ S.subject=val; S.topic=null; }
  if(key==='topic'){ S.topic=val; }
  render();
}

/* =========================================================
   КАБІНЕТ ВЧИТЕЛЯ
   ========================================================= */
function renderTeacher(){
  if(S.topic){
    return renderTeacherTopic();
  }
  const topics=DB.topics.filter(t=>t.subject==='math');
  app.innerHTML = `
    <h1 class="page">Кабінет вчителя</h1>
    <p class="sub">Марія Іванівна · вчитель математики. Керуйте темами та налаштовуйте інтерактивні завдання для учнів.</p>
    <div class="stat" style="margin-bottom:24px">
      <div class="box"><div class="n">${DB.classes.length}</div><div class="l">класів</div></div>
      <div class="box"><div class="n">${topics.length}</div><div class="l">тем з математики</div></div>
      <div class="box"><div class="n">${topics.reduce((a,t)=>a+t.tasks.length,0)}</div><div class="l">завдань створено</div></div>
      <div class="box"><div class="n">4</div><div class="l">інтерактивні інструменти</div></div>
    </div>

    <div class="section-title">📋 Теми та завдання</div>
    <div class="card">
      <table class="tbl">
        <tr><th>Тема</th><th>Клас</th><th>Завдань</th><th>Інструменти</th><th></th></tr>
        ${topics.map(t=>`
          <tr>
            <td><b>${esc(t.title)}</b></td>
            <td>${DB.classes.find(c=>c.id===t.cls).name}</td>
            <td>${t.tasks.length}</td>
            <td>${[...new Set(t.tasks.map(x=>x.tool))].map(tl=>DB.tools[tl].icon).join(' ')}</td>
            <td style="text-align:right"><button class="btn ghost sm" onclick="teacherOpen('${t.id}')">Налаштувати</button></td>
          </tr>`).join('')}
      </table>
    </div>

    <div class="section-title">🧪 Швидко перевірити інструмент</div>
    <div class="grid c2">
      ${Object.keys(DB.tools).map(tl=>`
        <div class="card click" onclick="openTool('${tl}',null,null)">
          <div class="ico" style="background:${DB.tools[tl].bg}">${DB.tools[tl].icon}</div>
          <h3>${DB.tools[tl].name}</h3>
          <p class="d">Відкрити інструмент і перевірити роботу</p>
        </div>`).join('')}
    </div>`;
}
function teacherOpen(id){ S.topic=id; render(); }

function renderTeacherTopic(){
  const t=DB.topics.find(x=>x.id===S.topic);
  const clsName=DB.classes.find(c=>c.id===t.cls).name;
  app.innerHTML = crumbs([{t:'Кабінет вчителя',go:"S.topic=null;render()"},{t:t.title}]) + `
    <h1 class="page">${esc(t.title)}</h1>
    <p class="sub">${esc(clsName)} клас · Математика. Тут ви налаштовуєте завдання, які учні розв’язують інтерактивно.</p>

    <div class="section-title">🧩 Завдання цієї теми</div>
    <div class="card">
      ${t.tasks.map(k=>`
        <div class="list-item">
          <div class="ic" style="background:${DB.tools[k.tool].bg}">${DB.tools[k.tool].icon}</div>
          <div class="txt"><b>${esc(k.title)}</b><small>${DB.tools[k.tool].name} · параметри: ${esc(cfgSummary(k.tool,k.cfg))}</small></div>
          <button class="btn ghost sm" onclick="editTask('${t.id}','${k.id}')">✏️ Змінити</button>
          <button class="btn gray sm" onclick="openTool('${k.tool}',${JSON.stringify(k.cfg).replace(/"/g,'&quot;')},null)">👁 Перегляд</button>
        </div>`).join('')}
      <button class="btn" style="margin-top:8px" onclick="addTask('${t.id}')">➕ Додати завдання</button>
    </div>`;
}

function cfgSummary(tool,cfg){
  if(tool==='mult') return `${cfg.a} × ${cfg.b}`;
  if(tool==='div')  return `${cfg.n} : ${cfg.d}`;
  if(tool==='eq')   return cfg.text;
  if(tool==='frac') return `${cfg.a}/${cfg.b} ${cfg.op} ${cfg.c}/${cfg.d}`;
  if(tool==='prop') return `${cfg.a} : ${cfg.b} = ${cfg.c} : ${cfg.d}`;
  if(tool==='dvk')  return `число ${cfg.n}`;
  return '';
}

/* ---- редагування / додавання завдання вчителем ---- */
function taskEditorFields(tool,cfg){
  cfg=cfg||{};
  if(tool==='mult') return `
    <div class="row">
      <div class="field" style="flex:1"><label class="fl">Перший множник</label><input id="f_a" type="number" value="${cfg.a||''}"></div>
      <div class="field" style="flex:1"><label class="fl">Другий множник</label><input id="f_b" type="number" value="${cfg.b||''}"></div>
    </div>`;
  if(tool==='div') return `
    <div class="row">
      <div class="field" style="flex:1"><label class="fl">Ділене</label><input id="f_n" type="number" value="${cfg.n||''}"></div>
      <div class="field" style="flex:1"><label class="fl">Дільник</label><input id="f_d" type="number" value="${cfg.d||''}"></div>
    </div>`;
  if(tool==='eq') return `
    <div class="field"><label class="fl">Рівняння (наприклад 3x + 5 = 20)</label><input id="f_text" value="${cfg.text||''}"></div>
    <p class="helper">Підтримуються лінійні рівняння з x з обох боків.</p>`;
  if(tool==='prop') return `
    <div class="row">

  render();
}
function closeTool(){ S.tool=null; S.toolCfg=null; S.steps=[]; S.step=0; render(); }

function buildSteps(){
  const c=S.toolCfg;
  try{
    if(S.tool==='mult') S.steps = c? multSteps(c.a,c.b) : [];
    if(S.tool==='div')  S.steps = c? divSteps(c.n,c.d) : [];
    if(S.tool==='eq'){ if(c){ S.eqModel=buildEqModel(c.text); S.steps=S.eqModel.rows.map(r=>({text:r.text, eq:true})); } else { S.eqModel=null; S.steps=[]; } }
    if(S.tool==='prop'){ if(c){ S.eqModel=buildProportion(c.a,c.b,c.c,c.d); S.steps=S.eqModel.rows.map(r=>({text:r.text, eq:true})); } else { S.eqModel=null; S.steps=[]; } }
    if(S.tool==='frac'){ if(c){ S.fracModel=buildFracModel(c.a,c.b,c.op,c.c,c.d); S.steps=S.fracModel.steps.map(s=>({text:s.text, frac:true})); } else { S.fracModel=null; S.steps=[]; } }
    if(S.tool==='dvk'){ if(c){ S.dvkModel=buildDvkModel(c.n); S.steps=S.dvkModel.steps.map(s=>({text:s.text, dvk:true, phase:s.phase})); } else { S.dvkModel=null; S.steps=[]; } }
  }catch(e){
    const msg = (typeof e==='string' && e!=='bad') ? e
      : (S.tool==='eq' ? 'Не вдалося прочитати рівняння. Приклад: 3x + 5 = 20 або 5x − 4 = 2x + 11.' : 'Перевірте введені значення.');
    S.steps=[{html:`<div class="empty">${esc(msg)}</div>`, text:msg}];
  }
}
