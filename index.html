/* ---------- helpers для колонкового рендера ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
// Відмальовка колонкового обчислення на клітинковій сітці.
// rows: [{cells:[...]}] або {line:true, span?:[from,to]} — лінія підкреслює попередній рядок.
function colGrid(rows, width){
  const content=[];
  for(const r of rows){
    if(r.line){
      if(content.length){
        const prev=content[content.length-1];
        if(r.span) prev.ulSpan=r.span; else prev.ulFull=true;
      }
    } else content.push({cells:r.cells, anim:r.anim});
  }
  const ctx={writing:true, order:0};                 // спільний лічильник для послідовного «письма»
  let h=`<div class="notebook" style="grid-template-columns:repeat(${width},var(--cell))">`;
  for(const r of content){
    for(let i=0;i<width;i++){
      const c=r.cells[i];
      let cls='nk'+(c?(' '+(c.cls||'')):' e');
      if(r.ulFull || (r.ulSpan && i>=r.ulSpan[0] && i<=r.ulSpan[1])) cls+=' ul';
      let inner='';
      if(c){ inner = (r.anim||c.anim) ? hwGlyphs(c.ch, ctx) : hwGlyphs(c.ch, {writing:false}); }
      h+=`<div class="${cls}">${inner}</div>`;
    }
  }
  return h+'</div>';
}
function mkRow(str,endCol,width,cls){
  const cells=Array(width).fill('');
  str=String(str);
  for(let k=0;k<str.length;k++){ const c=endCol-(str.length-1)+k; if(c>=0&&c<width) cells[c]={ch:str[k],cls}; }
  return {cells};
}

/* ---------- 1) МНОЖЕННЯ В СТОВПЧИК ---------- */
function multSteps(a,b){
  a=Math.abs(Math.trunc(a)); b=Math.abs(Math.trunc(b));
  if(!a||!b||a>999999||b>9999) throw 'bad';
  const total=a*b;
  const B=String(b);
  const width=String(total).length+1;
  const partials=[]; // {val, shift, digit}
  for(let i=B.length-1;i>=0;i--){ const digit=+B[i]; const shift=B.length-1-i; partials.push({val:a*digit, shift, digit}); }
  const steps=[];
  // базовий макет
  const rowA=()=>mkRow(a, width-1, width);
  const rowB=()=>{ const r=mkRow(b, width-1, width); const c=width-String(b).length-1; if(c>=0) r.cells[c]={ch:'×',cls:'op'}; return r; };

  // крок 0 — пишемо обидва множники
  const a0=rowA(); a0.anim=true; const b0=rowB(); b0.anim=true;
  steps.push({ html: colGrid([a0, b0, {line:true}], width),
    text:`Записуємо числа у стовпчик, вирівнюючи за розрядами. Множимо ${a} на ${b}.` });

  // кроки-часткові добутки (пишеться лише новий частковий добуток)
  const shownPartials=[];
  partials.forEach((p,idx)=>{
    const pr=mkRow(p.val, width-1-p.shift, width);
    shownPartials.push(pr);
    const rows=[rowA(), rowB(), {line:true}, ...shownPartials.map((x,i)=>({cells:x.cells, anim:i===idx}))];
    steps.push({ html: colGrid(rows, width),
      text: partials.length===1
        ? `Множимо ${a} × ${p.digit} = ${p.val}. Це і є відповідь.`
        : `Множимо ${a} на ${p.digit} (розряд ${p.shift===0?'одиниць':p.shift===1?'десятків':'сотень'}): ${a} × ${p.digit} = ${p.val}${p.shift?`, записуємо зі зсувом на ${p.shift} ${p.shift===1?'розряд':'розряди'} вліво`:''}.` });
  });

  // додавання часткових добутків — пишеться підсумок
  if(partials.length>1){
    const sum=mkRow(total, width-1, width, 'res'); sum.anim=true;
    const rows=[rowA(), rowB(), {line:true}, ...shownPartials.map(x=>({cells:x.cells})), {line:true}, sum];
    steps.push({ html: colGrid(rows, width),
      text:`Додаємо часткові добутки стовпчиком і отримуємо результат: ${total}.` });
  }
  // фінал
  steps.push({ html:hwEqline([{t:String(a)},{t:'×',cls:'op'},{t:String(b)},{t:'=',cls:'op'},{t:String(total),cls:'res'}]),
    text:`Готово! ${a} × ${b} = ${total}.` });
  return steps;
}

/* ---------- 2) ДІЛЕННЯ В СТОВПЧИК ---------- */
function divSteps(N,D){
  N=Math.abs(Math.trunc(N)); D=Math.abs(Math.trunc(D));
  if(!N||!D||D>N||D>9999) throw 'bad';
  const ds=String(N).split('').map(Number);
  const n=ds.length;
  const steps=[];
  // повна частка наперед — щоб ширина правого блоку не «стрибала»
  const fullQ=(()=>{let r=0,q='',st=false;for(const d of ds){const cur=r*10+d;const dq=Math.floor(cur/D);if(dq>0)st=true;if(st)q+=dq;r=cur-dq*D;}return q||'0';})();
  const dW=Math.max(String(D).length, fullQ.length);
  // заголовок «куточком»: ділене | дільник над часткою
  function header(work, quotient, opts={}){
    const dividend=mkRow(N,n-1,n); if(opts.animHead) dividend.anim=true;
    const left=colGrid([dividend, ...work], n);
    const divRow=mkRow(D, dW-1, dW); if(opts.animHead) divRow.anim=true;
    const quoRow=quotient? mkRow(quotient, dW-1, dW, 'res') : {cells:Array(dW).fill('')};
    if(opts.animQuot && quotient){ for(let k=quoRow.cells.length-1;k>=0;k--){ if(quoRow.cells[k]){ quoRow.cells[k].anim=true; break; } } }
    const right=colGrid([divRow, {line:true}, quoRow], dW);
    return `<div class="divwrap">${left}<div class="divbar"></div>${right}</div>`;
  }
  steps.push({ html:header([],'', {animHead:true}), text:`Ділимо ${N} на ${D} «куточком». Дільник ${D} записуємо праворуч, частку будемо писати під ним.` });

  const work=[];
  let r=0, quotient='', started=false;
  for(let i=0;i<n;i++){
    const cur=r*10+ds[i];
    const q=Math.floor(cur/D); const prod=q*D; const rem=cur-prod;
    if(q>0) started=true;
    if(started){
      quotient+=q;
      // рядок зменшуваного (поточний шматок) — end col = i
      const curRow=mkRow(cur, i, n, 'muted'); work.push(curRow);
      // добуток з мінусом
      const prow=mkRow(prod, i, n);
      const minusCol=i-String(prod).length; if(minusCol>=0) prow.cells[minusCol]={ch:'−',cls:'op'};
      work.push(prow);
      work.push({line:true, span:[Math.max(0,minusCol), i]});
      curRow.anim=true; prow.anim=true;                    // «пишемо» лише новий шматок і добуток + нову цифру частки
      steps.push({ html:header(work.slice(), quotient, {animQuot:true}),
        text:`${cur} : ${D} = ${q}, бо ${q} × ${D} = ${prod}. Віднімаємо: ${cur} − ${prod} = ${rem}${i<n-1?`, зносимо наступну цифру`:''}.` });
      curRow.anim=false; prow.anim=false;                  // далі показуємо їх статично
      // рядок остачі (буде основою наступного шматка)
      work.push(mkRow(rem, i, n, rem===0?'':'muted'));
      r=rem;
    } else {
      r=cur; // провідні нулі частки пропускаємо
    }
  }
  const finalRem=r;
  const parts=[{t:String(N)},{t:':',cls:'op'},{t:String(D)},{t:'=',cls:'op'},{t:quotient,cls:'res'}];
  if(finalRem){ parts.push({t:'('},{t:'ост. '+finalRem}); parts.push({t:')'}); }
  steps.push({ html:hwEqline(parts),
    text:`Готово! ${N} : ${D} = ${quotient}${finalRem?`, остача ${finalRem}`:', ділиться націло'}.` });
  return steps;
}

/* ---------- 3) РОЗВ'ЯЗУВАННЯ РІВНЯНЬ ---------- */
function parseSide(s){
  s=s.replace(/\s+/g,'').replace(/-/g,'+-').replace(/^\+/,'');
  const numRe=/^-?\d+(\.\d+)?$/;              // допускаємо лише чисті числа-коефіцієнти
  let a=0,b=0;
  for(const t of s.split('+')){
    if(t==='') continue;
    if(t.includes('x')){ let co=t.replace('x',''); if(co===''||co==='+')co='1'; if(co==='-')co='-1'; if(!numRe.test(co)) throw 'bad'; a+=parseFloat(co); }
    else { if(!numRe.test(t)) throw 'bad'; b+=parseFloat(t); }
  }
  return {a,b};
}
function fmtNum(x){ if(Number.isInteger(x)) return String(x); const g=gcd(Math.round(x*1000000),1000000); return String(Math.round(x*100)/100); }
function signed(x){ return x<0?`− ${Math.abs(x)}`:`+ ${x}`; }
const EQ_STEP=0.16; // затримка між появою сусідніх доданків при «написанні», с
function fmtX(c){ c=+c; const a=Math.abs(c); const s=c<0?'−':''; const cc=(a===1?'':fmtNum(a)); return s+cc+'x'; }
// Будуємо структуровану модель розв'язання: рядки з токенами, кожен токен має стійкий id
// (щоб анімувати переліт цифри зі старої позиції на нову), і тип переходу для кожного рядка.
// Тонка обгортка: розбирає текст рівняння й делегує лінійному ядру
function buildEqModel(text){
  if(!text||!text.includes('=')) throw 'Введіть рівняння зі знаком «=». Приклад: 3x + 5 = 20.';
  if(/[:/]/.test(text)) throw 'Цей інструмент поки розв’язує лінійні рівняння виду ax + b = cx + d (напр. 3x + 5 = 20). Для пропорцій є окремий інструмент «Пропорції».';
  if(text.split('=').length!==2) throw 'У рівнянні має бути один знак «=». Приклад: 5x − 4 = 2x + 11.';
  if(!/x/i.test(text)) throw 'У рівнянні має бути змінна x. Приклад: 3x + 5 = 20.';
  const [L,R]=text.split('=');
  return {rows: buildLinearRows(parseSide(L), parseSide(R))};
}
// ЛІНІЙНЕ ЯДРО (перевикористовується рівняннями і пропорціями):
// приймає коефіцієнти ls={a,b}, rs={a,b} і будує кроки «записуємо → перенос → зведення → ділимо → відповідь».
function buildLinearRows(ls, rs){
  const A=ls.a-rs.a, B=rs.b-ls.b;
  const EQ=()=>({id:'eq', t:'=', cls:'eq-eq'});
  const rows=[];
  // будуємо сторону з доданків: перший — зі своїм знаком (без окремого токена),
  // наступні — окремий знак 's'+id + модуль значення. Записуємо і опис одиниць.
  function emitSide(list, units){
    const t=[];
    list.forEach((u,i)=>{
      const fmt = u.xf? fmtX : fmtNum;               // формат визначає сам доданок (x-член чи число)
      if(i===0){ t.push({id:u.id, t:fmt(u.coef), from:u.from}); units && units.push({valId:u.id, signId:null, cross:!!u.cross}); }
      else { const sid='s'+u.id; t.push({id:sid, t:(u.coef<0?'−':'+'), cls:'op'}); t.push({id:u.id, t:fmt(Math.abs(u.coef)), from:u.from}); units && units.push({valId:u.id, signId:sid, cross:!!u.cross}); }
    });
    if(!list.length) t.push({id:'z', t:'0'});
    return t;
  }

  // 1) початкове рівняння
  const oL=[]; if(ls.a!==0) oL.push({id:'LX',coef:ls.a,xf:true}); if(ls.b!==0) oL.push({id:'LC',coef:ls.b,xf:false}); if(!oL.length) oL.push({id:'LC',coef:0,xf:false});
  const oR=[]; if(rs.a!==0) oR.push({id:'RX',coef:rs.a,xf:true}); if(rs.b!==0) oR.push({id:'RC',coef:rs.b,xf:false}); if(!oR.length) oR.push({id:'RC',coef:0,xf:false});
  rows.push({tokens:[...emitSide(oL), EQ(), ...emitSide(oR)],
    type:'write', text:'Записуємо рівняння. Наша мета — знайти x.'});

  const needMove = rs.a!==0 || ls.b!==0;
  if(needMove){
    // 2) перенос: x — ліворуч, числа — праворуч. Число летить РАЗОМ зі знаком; знак
    //    змінюється в момент приземлення (бо перейшло через «=»).
    const leftX=[]; if(ls.a!==0) leftX.push({id:'LX',coef:ls.a,xf:true,cross:false}); if(rs.a!==0) leftX.push({id:'RX',coef:-rs.a,xf:true,cross:true});
    const rightC=[]; if(rs.b!==0) rightC.push({id:'RC',coef:rs.b,xf:false,cross:false}); if(ls.b!==0) rightC.push({id:'LC',coef:-ls.b,xf:false,cross:true});
    const units=[];
    const mtoks=[...emitSide(leftX,units), EQ(), ...emitSide(rightC,units)];
    rows.push({tokens:mtoks, type:'move', note:'переносимо', moveUnits:units,
      text:'Переносимо доданки з x у ліву частину, а числа — у праву. Число летить разом зі своїм знаком, і коли приземляється по інший бік «=», його знак змінюється на протилежний.'});

    // 3) зводимо подібні: x-члени злітаються в A·x, числа — в B
    const axFrom=leftX.map(t=>t.id), bcFrom=rightC.map(t=>t.id);
    const rc=[{id:'ACX', t:(A===0?'0':fmtX(A)), from:axFrom}, EQ(), {id:'BCC', t:fmtNum(B), from:bcFrom}];
    const doneCombine = A===0;
    rows.push({tokens:rc, type:'combine', note: doneCombine?undefined:'зводимо подібні', done:doneCombine,
      text: doneCombine
        ? (B===0?'Цифри злітаються: ліворуч і праворуч виходить однаково — рівняння є тотожністю, розв’язків безліч.':'Цифри злітаються: ліворуч виходить 0, а праворуч інше число — рівняння не має розв’язків.')
        : `Додаємо однакові доданки: цифри злітаються разом. Ліворуч ${fmtNum(ls.a)} − ${fmtNum(rs.a)} = ${fmtNum(A)} перед x, праворуч ${fmtNum(rs.b)} − ${fmtNum(ls.b)} = ${fmtNum(B)}.`});
    if(A===0) return rows;
  } else if(A===0){
    rows.push({tokens:[{id:'z',t:'0'}, EQ(), {id:'RC',t:fmtNum(B)}], type:'write', done:true,
      text: B===0?'Рівняння є тотожністю — розв’язків безліч.':'Рівняння не має розв’язків.'});
    return rows;
  }

  const x=B/A;
  // 4) ділимо на коефіцієнт біля x
  rows.push({tokens:[{id:'x1',t:'x'}, EQ(), {id:'bdiv',t:fmtNum(B)}, {id:'od',t:':',cls:'op'}, {id:'adiv',t:fmtNum(A)}],
    type:'write', note:`ділимо на ${fmtNum(A)}`,
    text:`Щоб знайти x, ділимо обидві частини рівняння на коефіцієнт біля x, тобто на ${fmtNum(A)}.`});
  // 5) відповідь: виконуємо ділення — цифри злітаються в результат (як при додаванні/відніманні)
  rows.push({tokens:[{id:'x1',t:'x'}, EQ(), {id:'ans',t:fmtNum(x),cls:'res', from:['bdiv','adiv']}], type:'combine', done:true,
    text:`Виконуємо ділення: ${fmtNum(B)} : ${fmtNum(A)} = ${fmtNum(x)}. Цифри злітаються в результат. Отже, x = ${fmtNum(x)}.`});

  return rows;
}
// ПРОПОРЦІЯ: своя частина (записати → навхрест → перемножити) + делегування лінійному ядру.
function mulLin(u,v){ if(u.a && v.a) return null; return {a:u.a*v.b + v.a*u.b, b:u.b*v.b}; } // (лінійне × лінійне), null якщо x²
function buildProportion(nA,dA,nC,dC){
  const clean=s=>String(s==null?'':s).trim();
  nA=clean(nA); dA=clean(dA); nC=clean(nC); dC=clean(dC);
  if(!nA||!dA||!nC||!dC) throw 'Заповніть усі чотири частини пропорції. Приклад: x : 3 = 4 : 6.';
  let A,Bd,C,Dd;
  try{ A=parseSide(nA); Bd=parseSide(dA); C=parseSide(nC); Dd=parseSide(dC); }
  catch(e){ throw 'Кожна частина має бути числом або доданком з x (напр. 5x, 4, 2x). Приклад: x : 3 = 4 : 6.'; }
  // a:b = c:d  ⇒  добуток крайніх = добуток середніх:  a·d = c·b
  const P1=mulLin(A,Dd), P2=mulLin(C,Bd);
  if(!P1||!P2) throw 'Тут x множиться на x — виходить квадратне рівняння, а не лінійне. Такі поки не підтримуються.';
  let pid=0; const T=(t,cls)=>({id:'p'+(pid++), t, cls}); const OP=t=>T(t,'op'); const EQ=()=>({id:'p'+(pid++), t:'=', cls:'eq-eq'});
  const rows=[];
  // 1) сама пропорція:  nA : dA = nC : dC
  rows.push({tokens:[T(nA), OP(':'), T(dA), EQ(), T(nC), OP(':'), T(dC)], type:'write',
    text:'Записуємо пропорцію. Головна властивість: добуток крайніх членів дорівнює добутку середніх.'});
  // 2) множимо навхрест:  nA · dC = nC · dA
  rows.push({tokens:[T(nA), OP('·'), T(dC), EQ(), T(nC), OP('·'), T(dA)], type:'write', note:'навхрест',
    text:`Множимо навхрест: крайні ${nA} і ${dC}, середні ${dA} і ${nC}. Отримуємо ${nA}·${dC} = ${nC}·${dA}.`});
  // 3) далі — звичайне лінійне рівняння (перевикористовуємо лінійне ядро)
  const lin=buildLinearRows(P1,P2);
  lin[0].text='Перемножуємо — і виходить звичайне лінійне рівняння. Далі розв’язуємо його як завжди.';
  return {rows:[...rows, ...lin]};
}

// Рендер сцени рівняння: усі рядки 0..S.step; поточний рядок «пишеться» або анімується (перенос/зведення)
// ---- Рукописні гліфи: одноштрихові SVG-контури, що «малюються» пером (stroke-dashoffset) ----
const HW_STEP=0.2, HW_DUR=0.34;
const HW={
  '0':["M30,10 C13,10 13,90 30,90 C47,90 47,10 30,10"],
  '1':["M15,32 L31,12 L31,90"],
  '2':["M13,30 C13,8 49,8 49,32 C49,55 15,64 12,90 L52,88"],
  '3':["M14,22 C28,6 52,14 45,36 C41,50 27,49 27,49 C50,49 53,78 37,88 C24,96 12,86 12,72"],
  '4':["M44,90 L44,10 L9,66 L55,66"],
  '5':["M48,12 L20,12 L16,46 C31,38 50,45 48,66 C46,90 17,92 11,74"],
  '6':["M47,15 C27,10 14,42 14,63 C14,88 49,88 49,63 C49,47 18,45 15,60"],
  '7':["M11,14 L52,14 L25,90"],
  '8':["M30,47 C11,47 13,13 30,13 C47,13 49,47 30,47 C9,47 8,90 30,90 C52,90 51,47 30,47"],
  '9':["M47,55 C27,61 14,42 16,27 C18,11 48,11 46,38 C44,74 40,85 21,90"],
  'x':["M14,34 L46,72","M46,34 L14,72"],
  '×':["M16,36 L44,70","M44,36 L16,70"],
  '=':["M12,42 L52,42","M12,64 L52,64"],
  '+':["M32,28 L32,76","M12,52 L52,52"],
  '−':["M12,52 L52,52"],
  '-':["M12,52 L52,52"],
  ':':["M30,34 L30,40","M30,62 L30,68"],
  '.':["M29,84 L31,84"],
  '·':["M29,52 L31,52"],
};
// text -> послідовність намальованих гліфів. opts.writing=true — малюємо по черзі; order — лічильник гліфів.
function hwGlyphs(text, opts){
  const writing = opts && opts.writing;
  let html='';
  for(const ch of String(text)){
    const strokes=HW[ch];
    if(!strokes){ html+=`<span class="hwt">${ch}</span>`; continue; }
    const o = writing ? (opts.order++) : 0;
    let paths='';
    strokes.forEach((d,si)=>{
      if(writing){
        const dl=(o*HW_STEP + si*(HW_DUR*0.55)).toFixed(2);
        paths+=`<path d="${d}" pathLength="100" style="stroke-dasharray:100;stroke-dashoffset:100;animation:hwdraw ${HW_DUR}s ease ${dl}s forwards"/>`;
      } else {
        paths+=`<path d="${d}" pathLength="100"/>`;
      }
    });
    html+=`<svg class="hwg" viewBox="0 0 60 100">${paths}</svg>`;
  }
  return html;
}
// підсумковий рядок (напр. «284 × 36 = 10224») рукописними гліфами, послідовно
function hwEqline(parts){
  const ctx={writing:true, order:0};
  let h='<div class="eqline">';
  for(const p of parts){ h+=`<span class="${p.cls||''}">${hwGlyphs(p.t, ctx)}</span>`; }
  return h+'</div>';
}
// рукописний рядок без обгортки-центрування (для вбудованих у макет виразів)
function hwInline(parts){
  const ctx={writing:true, order:0};
  return parts.map(p=>`<span class="${p.cls||''}">${hwGlyphs(p.t, ctx)}</span>`).join('');
}

/* =========================================================
   ДІЛЬНИКИ І КРАТНІ — інструмент-контраст (чому це різне)
   ========================================================= */
function buildDvkModel(N){
  N = Math.max(2, Math.min(30, Math.round(N)||12));
  const divs=[]; for(let d=1; d<=N; d++) if(N%d===0) divs.push(d);
  const mult=[]; for(let k=1;k<=6;k++) mult.push(N*k);
  const isPrime = divs.length===2;
  // «міст»: одна дія читається двома мовами. Для складеного — менший дільник; для простого — власне кратне.
  let bridge;
  if(!isPrime){ const b=divs[1]; bridge={a:N, b, q:N/b}; }        // N : b = q
  else { bridge={a:N*2, b:N, q:2}; }                              // 2N : N = 2
  const steps=[
    {phase:'intro', text:`Візьмемо число <b>${N}</b>. У нього є <b>дільники</b> і є <b>кратні</b> — це зовсім різні речі. Порівняймо їх поруч.`},
    {phase:'div',   text:`<b>Дільники</b> — числа, на які ${N} ділиться <b>націло</b>. Шукаємо їх діленням: починаємо з <b>1</b> (найменший дільник) і закінчуємо самим <b>${N}</b> (найбільший). Вони «вкладаються» всередину числа, тому <b>не більші за ${N}</b>, і їх <b>скінченна</b> кількість — ось усі ${divs.length}.`},
    {phase:'mult',  text:`<b>Кратні</b> — числа, які самі діляться на ${N} націло (це ${N}, взяте 1, 2, 3… рази). Вони <b>не менші за ${N}</b> і тягнуться <b>без кінця</b> — кратних <b>нескінченно</b>.`},
    {phase:'bridge',text:`Обидва поняття — про одну дію. ${bridge.a} : ${bridge.b} = ${bridge.q} (остача 0) читається двома мовами: <b>${bridge.b}</b> — дільник ${bridge.a}, а <b>${bridge.a}</b> — кратне ${bridge.b}.`},
    {phase:'summary',text:`Головне: <b>дільник менший</b> — його «ділять на»; <b>кратне більше</b> — його «отримують». Дільників скінченно, кратних — нескінченно.`},
  ];
  return {N, divs, mult, isPrime, bridge, steps};
}

function dvkView(m, phase){
  // накопичувальний показ — як у зошиті нічого не зникає: секція зʼявляється на своєму кроці й лишається
  const ord={intro:0, div:1, mult:2, bridge:3, summary:4};
  const cur=ord[phase];
  const N=m.N, shown={div:cur>=ord.div, mult:cur>=ord.mult, bridge:cur>=ord.bridge, summary:cur>=ord.summary};
  let h='<div class="dvk">';
  // центральне число
  h+=`<div class="dvk-num"><div class="nbig">${N}</div><div class="ncap">наше число</div></div>`;

  // ЛАНА ДІЛЬНИКІВ — той самий ланцюг, що й у кратних, але ділення; починається з 1, закінчується числом
  if(shown.div){
    const last=m.divs.length-1;
    let stops='';
    m.divs.forEach((d,j)=>{
      const pop = phase==='div' ? ` pop" style="animation-delay:${j*0.09}s` : '';
      const edge = j===0 ? ' first' : (j===last ? ' last' : '');
      const cap = j===0 ? '<span class="kcap">найменший</span>' : (j===last ? '<span class="kcap">найбільший</span>' : '');
      stops+=`<span class="kstop${edge}${pop}"><span class="kv">${d}</span><span class="kk">${N}:${d}=${N/d}</span>${cap}</span>`;
      if(j<last) stops+=`<span class="kdash"></span>`;
    });
    h+=`<div class="dlane d">
      <div class="dlane-hd"><span class="lt">🟢 Дільники</span><span class="lsub">на них ділиться ${N}</span>
        <span class="cnt">скінченно: ${m.divs.length}</span></div>
      <div class="ktrack">${stops}<span class="kend"></span></div>
      <div class="note">${m.divs.join(', ')} — усі <b>≤ ${N}</b>. Починаємо завжди з <b>1</b> (найменший дільник будь-якого числа), закінчуємо самим <b>${N}</b> (найбільший). Вони йдуть парами: ${pairsText(m)}. Далі дільників немає — ланцюг <b>закінчується</b>.</div>
    </div>`;
  }

  // ЛАНА КРАТНИХ — відкритий ланцюг до ∞
  if(shown.mult){
    let stops='';
    m.mult.forEach((v,j)=>{
      const pop = phase==='mult' ? ` pop" style="animation-delay:${j*0.09}s` : '';
      stops+=`<span class="kstop${j===0?' first':''}${pop}"><span class="kv">${v}</span><span class="kk">${N}·${j+1}</span></span>`;
      stops+=`<span class="kdash"></span>`;
    });
    h+=`<div class="dlane k">
      <div class="dlane-hd"><span class="lt">🟡 Кратні</span><span class="lsub">самі діляться на ${N}</span>
        <span class="cnt">нескінченно ∞</span></div>
      <div class="ktrack">${stops}<span class="kinf">∞</span></div>
      <div class="note">${m.mult.join(', ')}, … — усі <b>≥ ${N}</b> і ланцюг <b>не закінчується</b>.</div>
    </div>`;
  }

  // МІСТ — одна дія, два прочитання
  if(shown.bridge){
    const B=m.bridge;
    const popcls = phase==='bridge' ? ' pop' : '';
    h+=`<div class="dvk-bridge${popcls}">
      <div class="bridge-eq" style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:var(--graphite)">
        ${B.a} <span style="color:var(--pink)">:</span> ${B.b} <span style="color:var(--pink)">=</span> ${B.q}<span class="rem">остача 0 ✓</span></div>
      <div class="bridge-reads">
        <div class="bread d"><span class="arw">↙︎</span><span class="big">${B.b} — ДІЛЬНИК ${B.a}</span><span class="sml">менше число, «залазить» усередину</span></div>
        <div class="bread k"><span class="arw">↗︎</span><span class="big">${B.a} — КРАТНЕ ${B.b}</span><span class="sml">більше число, «виходить» назовні</span></div>
      </div>
    </div>`;
  }

  // ПІДСУМОК — таблиця-контраст
  if(shown.summary){
    const dvExample = m.divs.length>6 ? m.divs.slice(0,6).join(', ')+' …' : m.divs.join(', ');
    h+=`<div class="dvk-sum"><table>
      <tr><th></th><th class="cd">🟢 Дільник</th><th class="ck">🟡 Кратне</th></tr>
      <tr><td class="rl">Приклади для ${N}</td><td class="cd">${dvExample}</td><td class="ck">${m.mult.slice(0,4).join(', ')}, … ∞</td></tr>
      <tr><td class="rl">Що це за число</td><td>вкладається в ${N}</td><td>містить ${N}</td></tr>
      <tr><td class="rl">Розмір</td><td class="cd">≤ ${N}</td><td class="ck">≥ ${N}</td></tr>
      <tr><td class="rl">Скільки їх</td><td class="cd">скінченно (${m.divs.length})</td><td class="ck">нескінченно (∞)</td></tr>
      <tr><td class="rl">Як питаємо</td><td>«${N} ділиться на&nbsp;?»</td><td>«? ділиться на&nbsp;${N}»</td></tr>
    </table></div>
    <div class="dvk-verdict">🔑 <b>Дільник менший</b> — на нього ділять число. <b>Кратне більше</b> — його отримують, повторюючи число.
      ${m.isPrime?`До речі, ${N} — <b>просте</b> число: у нього лише 2 дільники (1 і ${N}).`:''}</div>`;
  }

  return h+'</div>';
}
// пари дільників d × (N/d) — показуємо, що дільники йдуть парами
function pairsText(m){
  const seen=new Set(), out=[];
  for(const d of m.divs){ const p=m.N/d; const key=Math.min(d,p)+'x'+Math.max(d,p); if(seen.has(key))continue; seen.add(key); out.push(`${d}·${p}`); }
  return out.join(', ');
}
function eqStageInner(){
  const m=S.eqModel, cur=S.step;
  const animating = S.eqAnim && S.eqAnim.toStep===cur;
  let html='<div class="eqsolve" id="eqsolve">';
  for(let i=0;i<=cur;i++){
    const row=m.rows[i];
    const isCur=i===cur;
    const writing = isCur && row.type==='write' && !animating;
    let cls='eqrow'+(isCur?(row.done?' done-row':' cur'):'')+(writing?' writing':'');
    html+=`<div class="${cls}" data-row="${i}">`;
    const eqIdx = writing? row.tokens.findIndex(t=>t.cls&&t.cls.indexOf('eq-eq')>-1) : -1;
    // порядок «написання» — природний, зліва направо; лічильник — по гліфах
    let startOrder={}, total=0;
    if(writing){
      row.tokens.forEach((tk,ti)=>{ startOrder[ti]=total; total+=String(tk.t).length; });
    }
    row.tokens.forEach((tk,ti)=>{
      let style='';
      if(!writing && animating && isCur) style=' style="opacity:0"';
      const from = tk.from? ` data-from="${tk.from.join('|')}"`:'';
      const inner = writing ? hwGlyphs(tk.t, {writing:true, order:startOrder[ti]}) : hwGlyphs(tk.t, {writing:false});
      html+=`<span class="tok ${tk.cls||''}" data-id="${tk.id}"${from}${style}>${inner}</span>`;
    });
    if(row.note){
      let style=''; if(writing) style=` style="animation-delay:${(total*HW_STEP).toFixed(2)}s"`; else if(animating&&isCur) style=' style="opacity:0"';
      html+=`<span class="note tok" data-note="1"${style}>${row.note}</span>`;
    }
    html+='</div>';
  }
  return html+'</div>';
}

// Зчитуємо позиції токенів поточного (старого) рядка перед перемальовуванням
function captureEqRects(rowIndex){
  const solve=document.getElementById('eqsolve'); const map={};
  if(!solve) return map;
  const c=solve.getBoundingClientRect();
  const row=solve.querySelector(`.eqrow[data-row="${rowIndex}"]`); if(!row) return map;
  row.querySelectorAll('.tok[data-id]').forEach(el=>{
    const r=el.getBoundingClientRect();
    map[el.dataset.id]={left:r.left-c.left, top:r.top-c.top, w:r.width, h:r.height, text:el.innerHTML, cls:el.className};
  });
  return map;
}
// Готуємо анімацію ПЕРЕД зміною кроку (лише вперед на 1, лише для переносу/зведення)
function prepareEqAnim(to){
  S.eqAnim=null;
  if((S.tool!=='eq'&&S.tool!=='prop')||!S.eqModel) return;
  if(to!==S.step+1) return;
  const type=S.eqModel.rows[to] && S.eqModel.rows[to].type;
  if(type!=='move' && type!=='combine') return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  S.eqAnim={type, toStep:to, srcRects:captureEqRects(S.step)};
}
// Виконуємо FLIP-анімацію: цифри летять зі старих позицій на нові / злітаються в результат
function runEqAnim(){
  const anim=S.eqAnim; S.eqAnim=null; if(!anim) return;
  const solve=document.getElementById('eqsolve'); if(!solve) return;
  solve.style.position='relative';
  const c=solve.getBoundingClientRect();
  const rel=el=>{const r=el.getBoundingClientRect();return{left:r.left-c.left,top:r.top-c.top,w:r.width,h:r.height};};
  const newRow=solve.querySelector(`.eqrow[data-row="${anim.toStep}"]`); if(!newRow) return;
  const toks=[...newRow.querySelectorAll('.tok[data-id]')];
  const note=newRow.querySelector('[data-note]');
  solve.querySelectorAll('.eqclone').forEach(c=>c.remove());
  const DUR=1.0; // ~1 секунда на цифру
  let totalMs=0;

  if(anim.type==='move'){
    const units = (S.eqModel.rows[anim.toStep].moveUnits)||[];
    const unitByVal={}, signIds=new Set();
    units.forEach(u=>{ unitByVal[u.valId]=u; if(u.signId) signIds.add(u.signId); });
    // хелпери
    const fly=(el,src,tgt,dur,start)=>{
      const dx=src.left-tgt.left, dy=src.top-tgt.top;
      el.style.transition='none'; el.style.transform=`translate(${dx}px,${dy}px)`; el.style.opacity='0';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        el.style.transition=`transform ${dur}s cubic-bezier(.45,.02,.25,1) ${start.toFixed(2)}s, opacity .12s ease ${start.toFixed(2)}s`;
        el.style.transform='translate(0,0)'; el.style.opacity='1';
      }));
    };
    const fade=(el,start,dur)=>{ el.style.opacity='0'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transition=`opacity ${dur}s ease ${start.toFixed(2)}s`; el.style.opacity='1'; })); };
    // СТРОГО ПОСЛІДОВНО, доданок за доданком (знак — частина свого доданка)
    let cursor=0;
    toks.forEach(el=>{
      const id=el.dataset.id;
      if(signIds.has(id)) return;                 // знаки анімуються разом зі своїм числом
      const src=anim.srcRects[id], tgt=rel(el);
      const unit=unitByVal[id];
      const dur=(unit&&unit.cross)?DUR:0.4;
      const start=cursor; cursor+=dur+0.08;
      totalMs=Math.max(totalMs,(start+dur)*1000+350);
      if(src) fly(el,src,tgt,dur,start); else fade(el,start,0.2);
      // знак цього доданка
      if(unit&&unit.signId){
        const sEl=newRow.querySelector(`.tok[data-id="${unit.signId}"]`);
        if(sEl){
          const newSign=sEl.innerHTML;
          const ssrc=anim.srcRects[unit.signId];
          if(ssrc){ // знак був явно написаний — летить разом із числом, показуючи старий знак…
            sEl.innerHTML=ssrc.text;
            fly(sEl, ssrc, rel(sEl), dur, start);
            setTimeout(()=>{ sEl.innerHTML=newSign; sEl.style.animation='signFlip .38s ease-out'; }, (start+dur)*1000); // …і перевертається на посадці
          } else { // знака раніше не було — з'являється у момент приземлення
            sEl.style.opacity='0';
            setTimeout(()=>{ sEl.style.opacity='1'; sEl.style.animation='signFlip .38s ease-out'; }, (start+dur)*1000);
          }
        }
      }
    });
  } else if(anim.type==='combine'){
    let order=0;
    toks.forEach(el=>{
      const id=el.dataset.id, tgt=rel(el);
      const from=el.dataset.from? el.dataset.from.split('|').filter(Boolean):[];
      if(from.length){
        el.style.opacity='0';
        const delay=order*DUR; order++;
        from.forEach((sid,si)=>{
          const src=anim.srcRects[sid]; if(!src) return;
          const clone=document.createElement('span');
          clone.className='eqclone '+(src.cls||'tok');
          clone.innerHTML=src.text;
          clone.style.left=src.left+'px'; clone.style.top=src.top+'px';
          clone.style.transition=`transform ${DUR}s cubic-bezier(.45,.02,.25,1) ${(delay+si*0.1).toFixed(2)}s, opacity .3s ease ${(delay+DUR-0.25).toFixed(2)}s`;
          solve.appendChild(clone);
          const dx=(tgt.left+tgt.w/2)-(src.left+src.w/2), dy=(tgt.top+tgt.h/2)-(src.top+src.h/2);
          requestAnimationFrame(()=>requestAnimationFrame(()=>{ clone.style.transform=`translate(${dx}px,${dy}px)`; clone.style.opacity='0'; }));
        });
        setTimeout(()=>{ el.style.opacity='1'; el.style.animation='tokPop .4s ease-out'; }, (delay+DUR)*1000);
        totalMs=Math.max(totalMs,(delay+DUR)*1000+400);
      } else {
        const src=anim.srcRects[id];
        if(src){ const dx=src.left-tgt.left, dy=src.top-tgt.top;
          el.style.transition='none'; el.style.transform=`translate(${dx}px,${dy}px)`; el.style.opacity='1';
          requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transition='transform .5s ease'; el.style.transform='translate(0,0)'; }));
        } else { el.style.opacity='1'; }
      }
    });
  }
  if(note){ note.style.opacity='0'; note.style.transition='opacity .5s ease'; setTimeout(()=>note.style.opacity='1', totalMs+150); }
}

/* ---------- 4) ДІЇ З ДРОБАМИ ----------
   Розв'язання йде в ОДНОМУ рядку: кожен крок дописує «= <новий вигляд>».
   Коли рядок заповнюється — сегмент автоматично переноситься на новий (flex-wrap). */
function buildFracModel(a,b,op,c,d){
  a=Math.trunc(a);b=Math.trunc(b);c=Math.trunc(c);d=Math.trunc(d);
  if(!b||!d) throw 'bad';
  const plus = op!=='-';
  const sign = plus?'+':'−';
  const F=(n,dd)=>({type:'frac',n,d:dd});
  const O=()=>({type:'op',t:sign});
  const N=(n)=>({type:'num',t:fmtNum(n)});
  const segs=[];          // сегменти ланцюжка (горизонтально)
  const steps=[];         // кроки: {chainUpto, newSeg, denom, text}
  segs.push({units:[F(a,b), O(), F(c,d)]});
  steps.push({chainUpto:1, newSeg:true, text:`Записуємо вираз. Потрібно ${plus?'додати':'відняти'} два дроби.`});

  let L,na,nc;
  if(b!==d){
    // ІТЕРАТИВНИЙ пошук НСК: по черзі відкриваємо наступне кратне кожного знаменника
    // й після кожного перевіряємо збіг. Перший збіг — це НСК.
    const multsB=[], multsD=[];
    const denSnap=(newSide, matchVal, showMult, ka, kc, Lv)=>({b,d, multsB:multsB.slice(), multsD:multsD.slice(), bShown:multsB.length, dShown:multsD.length, newSide, matchVal:matchVal||null, showMult:!!showMult, ka, kc, L:Lv});
    let k=1, match=null;
    while(!match && k<=200){
      const vb=k*b; multsB.push(vb);
      const mb = multsD.includes(vb);
      steps.push({chainUpto:1, denom:denSnap('b', mb?vb:null),
        text: mb ? `Наступне кратне ${b}: ${k}×${b} = ${vb}. А ${vb} вже є серед кратних ${d}! Отже, ${vb} — найменше спільне кратне: НСК(${b}, ${d}) = ${vb}.`
                 : `Наступне кратне ${b}: ${k}×${b} = ${vb}.`});
      if(mb){ match=vb; break; }
      const vd=k*d; multsD.push(vd);
      const md = multsB.includes(vd);
      steps.push({chainUpto:1, denom:denSnap('d', md?vd:null),
        text: md ? `Наступне кратне ${d}: ${k}×${d} = ${vd}. А ${vd} вже є серед кратних ${b}! Отже, ${vd} — найменше спільне кратне: НСК(${b}, ${d}) = ${vd}.`
                 : `Наступне кратне ${d}: ${k}×${d} = ${vd}. Спільного числа ще немає — беремо наступні кратні.`});
      if(md){ match=vd; break; }
      k++;
    }
    L = match || (b/gcd(b,d)*d);
    const ka=L/b, kc=L/d; na=a*ka; nc=c*kc;
    // 1) множення показуємо прямо в дробах: 7·3/10·3 + 2·2/15·2 (множник — маркер «·» → окремий стиль)
    const mul=(base,k)=>`${base}·${k}`;
    segs.push({units:[F(mul(a,ka),mul(b,ka)), O(), F(mul(c,kc),mul(d,kc))], note:'домножуємо чисельник і знаменник'});
    steps.push({chainUpto:segs.length, newSeg:true, denom:denSnap('', L, true, ka, kc, L),
      text:`Скільки разів кожен знаменник уміщається в ${L}? ${b}×${ka}=${L} і ${d}×${kc}=${L}. Множимо і чисельник, і знаменник кожного дробу на цей множник — значення дробу не зміниться.`});
    // 2) обчислений результат: 21/30 + 4/30 (7·3 вилітає й перетворюється на 21)
    segs.push({units:[F(na,L), O(), F(nc,L)], note:`спільний знаменник ${L}`});
    steps.push({chainUpto:segs.length, newSeg:true, flip:'morph',
      text:`Перемножуємо: ${a}·${ka}=${na} над ${b}·${ka}=${L}, і ${c}·${kc}=${nc} над ${d}·${kc}=${L}. Дроби зведені до спільного знаменника ${L}.`});
  } else { L=b; na=a; nc=c; }

  const num = plus? na+nc : na-nc;
  segs.push({units:[F(num,L)], note:plus?'додаємо чисельники':'віднімаємо чисельники', done:true});
  steps.push({chainUpto:segs.length, newSeg:true, flip:'add',
    text:`${plus?'Додаємо':'Віднімаємо'} чисельники, знаменник лишається спільним: ${na} ${sign} ${nc} = ${num}. Отримали ${num}/${L}.`});

  // скорочення
  const g=gcd(Math.abs(num),L);
  let fn=num, fd=L;
  if(g>1 && num!==0){ fn=num/g; fd=L/g;
    segs[segs.length-1].done=false;
    segs.push({units:[F(fn,fd)], note:`скорочуємо на ${g}`, done:true});
    steps.push({chainUpto:segs.length, newSeg:true, flip:'morph', text:`Чисельник і знаменник діляться на ${g}: скорочуємо дріб — ${num}:${g}=${fn}, ${L}:${g}=${fd}.`});
  }
  // ціле або мішане число
  if(fd===1){
    segs[segs.length-1].done=false;
    segs.push({units:[N(fn)], done:true});
    steps.push({chainUpto:segs.length, newSeg:true, text:`Знаменник дорівнює 1 — це ціле число ${fn}.`});
  } else if(Math.abs(fn)>=fd){
    const whole=Math.trunc(fn/fd), rest=Math.abs(fn%fd);
    if(rest!==0){ segs[segs.length-1].done=false;
      segs.push({units:[{type:'mixed',whole,n:rest,d:fd}], note:'мішане число', done:true});
      steps.push({chainUpto:segs.length, newSeg:true, text:`Дріб неправильний: виділяємо цілу частину — ${whole} цілих і ${rest}/${fd}.`});
    }
  }
  return {segments:segs, steps};
}
const FRAC_STEP=0.36;
// число рукописними гліфами; якщо є маркер «·» (множник) — частину «·k» виділяємо стилем .fmul
function hwNum(value, ctx){
  const s=String(value); const dot=s.indexOf('·');
  if(dot<0) return hwGlyphs(s, ctx);
  return hwGlyphs(s.slice(0,dot), ctx) + `<span class="fmul">${hwGlyphs('·'+s.slice(dot+1), ctx)}</span>`;
}
// риска дробу отримує «такт» у послідовності письма (малюється між чисельником і знаменником)
function fbar(ctx){ let d=''; if(ctx.writing){ d=` style="animation-delay:${(ctx.order*HW_STEP).toFixed(2)}s"`; ctx.order++; } return `<span class="fbar"${d}></span>`; }
function renderFUnit(u, ctx){
  if(u.type==='frac') return `<span class="funit"><span class="frac"><span class="fn">${hwNum(u.n,ctx)}</span>${fbar(ctx)}<span class="fd">${hwNum(u.d,ctx)}</span></span></span>`;
  if(u.type==='op')   return `<span class="funit fop">${hwGlyphs(String(u.t),ctx)}</span>`;
  if(u.type==='mixed')return `<span class="funit"><span class="fmix">${hwGlyphs(String(u.whole),ctx)}</span><span class="frac"><span class="fn">${hwNum(u.n,ctx)}</span>${fbar(ctx)}<span class="fd">${hwNum(u.d,ctx)}</span></span></span>`;
  return `<span class="funit">${hwGlyphs(String(u.t),ctx)}</span>`;
}
// Робоча область пошуку НСК: кожен чип підписаний номером кратного (×1, ×2 …).
// Номер, на якому стоїть НСК, — це і є множник для того дробу.
function renderDenom(dn){
  const row=(label, arr, side)=>{
    let s=`<div class="denrow"><span class="denlbl">${label}</span>`;
    for(let i=0;i<arr.length;i++){
      const v=arr[i];
      const hl = dn.matchVal && v===dn.matchVal;
      const isNew = (i===arr.length-1) && dn.newSide===side;
      const isMul = dn.showMult && hl;                 // на кроці множників підсвічуємо номер
      s+=`<span class="denchip${hl?' hl':''}${isNew?' chipnew':''}${isMul?' mul':''}"><span class="chipk">×${i+1}</span><span class="chipv">${v}</span></span>`;
    }
    return s+'</div>';
  };
  let h=`<div class="denbox"><div class="denttl">🔍 Шукаємо спільний знаменник — НСК(${dn.b}, ${dn.d})</div>`;
  h+=row(`Кратні ${dn.b}:`, dn.multsB, 'b');
  h+=row(`Кратні ${dn.d}:`, dn.multsD, 'd');
  if(dn.matchVal && !dn.showMult) h+=`<div class="denres">Спільне кратне знайдено → НСК(${dn.b}, ${dn.d}) = <b>${dn.matchVal}</b></div>`;
  if(dn.showMult) h+=`<div class="denres">Дивимось, котре це кратне: ${dn.L} — це <b class="mk">×${dn.ka}</b> кратне ${dn.b} і <b class="mk">×${dn.kc}</b> кратне ${dn.d}. Це і є множники для дробів!</div>`;
  return h+'</div>';
}
// Рендер сцени дробів: горизонтальний ланцюжок + робоча область НСК (за потреби)
function fracStageInner(){
  const m=S.fracModel, st=m.steps[S.step];
  let html='<div class="fracwork"><div class="fracsolve">';
  for(let i=0;i<st.chainUpto;i++){
    const seg=m.segments[i], isCur=(i===st.chainUpto-1) && st.newSeg;
    const isFlip = isCur && st.flip;                          // крок-обчислення: числа прилітають зі старого сегмента
    const isWrite = isCur && !st.flip;                        // звичайний послідовний запис
    const flymul = isCur && st.denom && st.denom.showMult;    // множники прилетять із блоку НСК
    const ctx = isWrite ? {writing:true, order:0} : {writing:false};   // рукописне письмо, глиф за гліфом
    html+=`<span class="fseg${seg.done?' fdone':''}${isWrite?' writing':''}${isFlip?' morphing':''}${flymul?' flymul':''}"><span class="fseg-math">`;
    if(i>0) html+=`<span class="funit feq">${hwGlyphs('=',ctx)}</span>`;
    seg.units.forEach(u=>{ html+=renderFUnit(u, ctx); });      // чисельник → риска → знаменник → знак → …
    html+='</span>';
    if(seg.note){ const d=isWrite?` style="animation-delay:${(ctx.order*HW_STEP).toFixed(2)}s"`:''; html+=`<span class="fnote"${d}>${seg.note}</span>`; }
    html+='</span>';
  }
  html+='</div>';
  if(st.denom) html+=renderDenom(st.denom);
  return html+'</div>';
}
// Анімація: множники (×3, ×2) вилітають із чипів НСК і летять у дроби (в чисельник і знаменник)
function runFracMulAnim(){
  const st = S.fracModel && S.fracModel.steps[S.step];
  if(!(st && st.denom && st.denom.showMult)) return;
  const work=document.querySelector('.fracwork'); if(!work) return;
  const seg=work.querySelector('.fseg.flymul'); if(!seg) return;
  const fmuls=[...seg.querySelectorAll('.fmul')]; if(!fmuls.length) return;
  const reveal=()=>fmuls.forEach(t=>{t.style.opacity='1';});
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ reveal(); return; }
  const sources=[...work.querySelectorAll('.denchip.mul .chipk')];
  if(sources.length<2){ reveal(); return; }
  work.style.position='relative';
  const wr=work.getBoundingClientRect();
  const rel=el=>{const r=el.getBoundingClientRect();return{left:r.left-wr.left,top:r.top-wr.top,w:r.width,h:r.height};};
  work.querySelectorAll('.fmulclone').forEach(c=>c.remove());
  // fmuls у порядку: [чисельник1, знаменник1, чисельник2, знаменник2]
  // СТРОГО ПОСЛІДОВНО — кожен наступний стартує лише коли попередній приземлився,
  // і лише після того, як базовий дріб уже дописано (рахуємо намальовані гліфи)
  const baseGlyphs = seg.querySelectorAll('.fseg-math .hwg').length - seg.querySelectorAll('.fmul .hwg').length;
  const bars = seg.querySelectorAll('.fbar').length;
  const half=Math.ceil(fmuls.length/2), DUR=0.55, GAP=0.16, START=(baseGlyphs+bars)*HW_STEP + HW_DUR + 0.2;
  fmuls.forEach((tgt,idx)=>{
    const src = idx<half? sources[0] : sources[1];   // 1-й дріб ← множник знаменника b, 2-й ← d
    const sR=rel(src), tR=rel(tgt);
    const clone=document.createElement('span');
    clone.className='fmulclone'; clone.innerHTML=tgt.innerHTML;
    clone.style.left=sR.left+'px'; clone.style.top=sR.top+'px'; clone.style.opacity='0';
    work.appendChild(clone);
    const dx=(tR.left+tR.w/2)-(sR.left+sR.w/2), dy=(tR.top+tR.h/2)-(sR.top+sR.h/2);
    const delay=START+idx*(DUR+GAP);
    clone.style.transition=`transform ${DUR}s cubic-bezier(.4,.05,.2,1) ${delay.toFixed(2)}s, opacity .12s ease ${delay.toFixed(2)}s`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ clone.style.opacity='1'; clone.style.transform=`translate(${dx}px,${dy}px)`; }));
    setTimeout(()=>{ tgt.style.opacity='1'; tgt.style.animation='fmulPop .32s ease-out'; clone.remove(); }, (delay+DUR)*1000);
  });
}

// Готуємо FLIP перед зміною кроку (лише вперед, лише для кроків-обчислень).
// Джерело лишається на екрані (попередній сегмент), тож позиції читаємо вже після рендера.
function prepareFracAnim(to){
  S.fracFlip=null;
  if(S.tool!=='frac'||!S.fracModel) return;
  if(to!==S.step+1) return;
  const st=S.fracModel.steps[to]; if(!st||!st.flip) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  S.fracFlip={kind:st.flip, newIdx:st.chainUpto-1};
}
// Виконуємо FLIP: число ВИЛІТАЄ зі старого місця (оригінал ховаємо, щоб не було здвоєння)
// і перетворюється на результат у новому.
function runFracFlip(){
  const flip=S.fracFlip; S.fracFlip=null; if(!flip) return;
  const work=document.querySelector('.fracwork'); if(!work) return;
  work.style.position='relative';
  const cont=work.getBoundingClientRect();
  const rel=el=>{const r=el.getBoundingClientRect();return{left:r.left-cont.left,top:r.top-cont.top,w:r.width,h:r.height};};
  const segEls=work.querySelectorAll('.fracsolve .fseg');
  const newSeg=segEls[flip.newIdx], srcSeg=segEls[flip.newIdx-1];
  if(!newSeg||!srcSeg) return;
  const newFracs=[...newSeg.querySelectorAll('.frac')];
  const srcFracs=[...srcSeg.querySelectorAll('.frac')];
  work.querySelectorAll('.fracmorph').forEach(c=>c.remove());
  const DUR=0.62, GAP=0.18;
  // один елемент-джерело летить у ціль і перетворюється на неї.
  // keep=true — оригінал НЕ ховаємо (лишається на місці як запис кроку)
  const flyOne=(srcEl, tgtEl, delay, keep)=>{
    const sR=rel(srcEl), tR=rel(tgtEl);
    tgtEl.style.opacity='0'; if(!keep) srcEl.style.visibility='hidden';
    const c=document.createElement('span'); c.className='fracmorph'; c.innerHTML=srcEl.innerHTML;
    c.style.left=sR.left+'px'; c.style.top=sR.top+'px';
    work.appendChild(c);
    const dx=(tR.left+tR.w/2)-(sR.left+sR.w/2), dy=(tR.top+tR.h/2)-(sR.top+sR.h/2);
    c.style.transition=`transform ${DUR}s cubic-bezier(.4,.05,.2,1) ${delay.toFixed(2)}s`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.style.transform=`translate(${dx}px,${dy}px)`; }));
    setTimeout(()=>{ tgtEl.style.opacity='1'; tgtEl.style.animation='fmulPop .32s ease-out'; if(!keep) srcEl.style.visibility='visible'; c.remove(); }, (delay+DUR)*1000);
  };
  if(flip.kind==='morph'){
    // 1-до-1, ПОСЛІДОВНО: чисельник1 → знаменник1 → чисельник2 → …
    let t=0.15;
    newFracs.forEach((fr,i)=>{
      const s=srcFracs[i]; if(!s) return;
      flyOne(s.querySelector('.fn'), fr.querySelector('.fn'), t); t+=DUR+GAP;
      flyOne(s.querySelector('.fd'), fr.querySelector('.fd'), t); t+=DUR+GAP;
    });
  } else if(flip.kind==='add'){
    const fr=newFracs[0]; if(!fr) return;
    const newFn=fr.querySelector('.fn'), newFd=fr.querySelector('.fd');
    const fn0=srcFracs[0].querySelector('.fn'), fn1=srcFracs[1]?srcFracs[1].querySelector('.fn'):null;
    const opEl=srcSeg.querySelector('.fseg-math .fop'); const opHtml=opEl?opEl.innerHTML:hwGlyphs('+',{writing:false});
    // ЄДИНИЙ напис "21 + 4" — злітає з чисельників (оригінали лишаються) і зводиться в новий чисельник
    const label=document.createElement('span'); label.className='fracmorph fmlabel';
    label.innerHTML = fn1 ? `${fn0.innerHTML}<span class="fmop">${opHtml}</span>${fn1.innerHTML}` : fn0.innerHTML;
    work.appendChild(label);
    const lw=label.getBoundingClientRect().width, lh=label.getBoundingClientRect().height;
    const r0=rel(fn0), r1=fn1?rel(fn1):r0;
    const startCX=((r0.left+r0.w/2)+(r1.left+r1.w/2))/2, startTop=r0.top-4;
    label.style.left=(startCX-lw/2)+'px'; label.style.top=startTop+'px'; label.style.opacity='0';
    const tR=rel(newFn); newFn.style.opacity='0';
    const dx=(tR.left+tR.w/2)-startCX, dy=(tR.top+tR.h/2)-(startTop+lh/2);
    const delay=0.25, D2=0.8;
    label.style.transition=`transform ${D2}s cubic-bezier(.4,.05,.2,1) ${delay}s, opacity .18s ease ${delay}s`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ label.style.opacity='1'; label.style.transform=`translate(${dx}px,${dy}px)`; }));
    // на посадці напис стискається й зникає, а на його місці з'являється сума
    setTimeout(()=>{ label.style.transition='transform .22s ease, opacity .22s ease'; label.style.transform=`translate(${dx}px,${dy}px) scale(.4)`; label.style.opacity='0'; }, (delay+D2-0.02)*1000);
    setTimeout(()=>{ newFn.style.opacity='1'; newFn.style.animation='fmulPop .42s ease-out'; label.remove(); }, (delay+D2+0.18)*1000);
    // спільний знаменник переноситься вниз (оригінал лишається)
    flyOne(srcFracs[0].querySelector('.fd'), newFd, delay+D2+0.26, true);
  }
}

/* ---- старт ---- */
render();
</script>
